name: Offline Python and JavaScript tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check PR Git-object hygiene (not publication approval)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git show "${BASE_SHA}:tests/contribution_integrity.py" > /tmp/hf_contribution_integrity.py; then
            echo "HOLD: protected-base guard unavailable" >&2
            exit 1
          fi
          python3 -B /tmp/hf_contribution_integrity.py --base "${BASE_SHA}" --head HEAD
      - name: Verify Python environment
        run: python3 --version
      - name: Run deterministic offline tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify JavaScript environment
        run: node --version
      - name: Run deterministic public site JavaScript tests
        run: node --test tests/*.test.cjs
      - name: Check standalone site JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in docs/*.js; do
            node --check "$script"
          done
